name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TDS identity: 24f3004020@ds.study.iitm.ac.in
        run: echo "24f3004020@ds.study.iitm.ac.in"

      - name: Test release gate
        run: pytest -q
